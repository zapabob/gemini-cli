# Config for the Gemini Pull Request Review Bot.
# https://github.com/marketplace/gemini-code-assist
model: 'gemini-1.5-pro-latest'
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: 'HIGH'
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
ignore_patterns: []

# MCP Servers Configuration
mcpServers:
  deepresearch-mcp:
    command: "node"
    args:
      - "C:\\Users\\downl\\Desktop\\gemini-cli-main\\mcp-servers\\deepresearch-mcp\\dist\\index.js"
    env:
      NODE_ENV: "production"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    description: "Deep Research MCP Server for comprehensive research capabilities"
    capabilities:
      - deep_research
      - web_search
      - document_analysis
      - research_report_generation
