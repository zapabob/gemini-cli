name = "list"
description = "登録されているサブエージェントの一覧を表示します"

prompt = """
あなたはサブエージェント管理システムです。現在登録されているサブエージェントの一覧を表示してください。

以下の情報を含めて表示してください：
- サブエージェントID
- 名前
- 専門分野
- 現在の状態
- 最後に使用された日時
- タスク実行回数

サブエージェントが存在しない場合は、その旨を明示してください。

実行するコマンド：
```bash
node -e "
const fs = require('fs');
const path = require('path');

try {
  const configPath = path.join('.gemini', 'subagents.json');
  if (fs.existsSync(configPath)) {
    const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
    console.log('📋 サブエージェント一覧:');
    console.log('='.repeat(50));
    
    if (config.subagents && config.subagents.length > 0) {
      config.subagents.forEach((sub, index) => {
        console.log(\`\${index + 1}. ID: \${sub.id}\`);
        console.log(\`   名前: \${sub.name}\`);
        console.log(\`   専門分野: \${sub.specialty}\`);
        console.log(\`   状態: \${sub.status}\`);
        console.log(\`   作成日: \${new Date(sub.createdAt).toLocaleString('ja-JP')}\`);
        console.log(\`   タスク履歴: \${sub.taskHistory ? sub.taskHistory.length : 0}件\`);
        console.log(\`   アクティブ: \${sub.isActive ? '✅' : '❌'}\`);
        console.log('');
      });
    } else {
      console.log('❌ 登録されているサブエージェントがありません。');
    }
  } else {
    console.log('❌ サブエージェント設定ファイルが見つかりません。');
  }
} catch (error) {
  console.error('❌ エラー:', error.message);
}
"
""" 